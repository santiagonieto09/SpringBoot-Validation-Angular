<div class="card bg-dark text-white">
    <div class="card-header">{{ titulo }}</div>
    <div class="card-body">

    <form [formGroup]="formulario" (ngSubmit)="crearCliente()">
      <div class="form-group row">
        <label for="nombre" class="col-form-label col-sm-2">Nombre:</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" formControlName="nombre" />
          <div *ngIf="formulario.get('nombre')?.invalid && (formulario.get('nombre')?.dirty || formulario.get('nombre')?.touched)" class="alert alert-danger">
            <div *ngIf="formulario.get('nombre')?.errors?.['required']">
              El nombre está vacio.
            </div>
          </div>
          <div *ngIf="listaErrores?.nombre" class="alert alert-danger">
            {{listaErrores.nombre}}
          </div>
        </div>
      </div>

      <div class="form-group row">
        <label for="apellido" class="col-form-label col-sm-2">Apellido:</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" formControlName="apellido" />
          <div *ngIf="formulario.get('apellido')?.invalid && (formulario.get('apellido')?.dirty || formulario.get('apellido')?.touched)" class="alert alert-danger">
            <div *ngIf="formulario.get('apellido')?.errors?.['required']">
              El apellido está vacio.
            </div>
          </div>
          <div *ngIf="listaErrores?.apellido" class="alert alert-danger">
            {{listaErrores.apellido}}
          </div>
        </div>
      </div>

      <div class="form-group row">
        <label for="email" class="col-form-label col-sm-2">Email:</label>
        <div class="col-sm-6">
          <input type="email" class="form-control" formControlName="email" />
          <div *ngIf="formulario.get('email')?.invalid && (formulario.get('email')?.dirty)" class="alert alert-danger">
            <div *ngIf="formulario.get('email')?.errors?.['required']">
              El email está vacio.
            </div>            
          </div>
          <div *ngIf="listaErrores?.email" class="alert alert-danger">
            {{listaErrores.email}}
          </div>
        </div>
      </div>

      <button class="btn btn-primary" type="submit">Crear</button>
    </form>
  
  </div>
